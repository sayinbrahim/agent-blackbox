<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">agent-blackbox</title>
  <desc id="d">A flight recorder for AI coding agents. bbx records what Claude Code does into a hash-chained log.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b222c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="14" fill="#0b0e13"/>
  <rect width="1280" height="320" rx="14" fill="url(#grid)"/>
  <rect x="0" y="316" width="1280" height="4" fill="#f5a524"/>

  <text x="64" y="74" fill="#f5a524" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" letter-spacing="4" font-weight="700">FLIGHT DATA RECORDER · CLAUDE CODE</text>
  <text x="62" y="148" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="700">agent-blackbox</text>
  <text x="64" y="194" fill="#9aa7b4" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26">Every prompt, tool call and edit, in a log you can verify.</text>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">
    <text x="64" y="252" fill="#f5a524">$ bbx blame src/Orders/OrderService.cs:5</text>
    <text x="64" y="280" fill="#d7dde6">Line 5: AI-written · prompt <tspan fill="#4fd1c5">#2</tspan> "Make the retry count 5." · unchanged since</text>
  </g>

  <!-- trace: records joined by hashes -->
  <g transform="translate(860 96)">
    <polyline points="0,70 40,70 56,22 72,118 88,46 104,70 150,70 166,40 182,100 198,70 250,70 266,30 282,110 298,70 356,70"
              fill="none" stroke="#4fd1c5" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
    <g fill="#0b0e13" stroke="#f5a524" stroke-width="2">
      <circle cx="0" cy="70" r="6"/><circle cx="104" cy="70" r="6"/><circle cx="198" cy="70" r="6"/><circle cx="298" cy="70" r="6"/><circle cx="356" cy="70" r="6"/>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6b7785">
      <text x="-14" y="160">sha256</text><text x="88" y="160">prev</text><text x="182" y="160">prev</text><text x="282" y="160">prev</text>
    </g>
    <text x="0" y="196" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#4fd1c5">CHAIN ✓ VERIFIED · VERIFICATION STALE</text>
  </g>
</svg>
