name: release

# A v* tag builds Native AOT binaries, NuGet tool packages and the VS Code extension, checks that the tool installs and
# records, then publishes to nuget.org (trusted publishing, no stored API key) and creates the GitHub Release with the
# binaries and the .vsix. The extension also goes to the VS Code Marketplace / Open VSX when the VSCE_PAT / OVSX_PAT
# secrets are set; without them those steps are skipped.
# Pull requests that touch packaging run the same jobs as a dry run (nothing is published).
# Running it by hand (workflow_dispatch) only checks that nuget.org trusted publishing accepts this workflow.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src/**/*.csproj
      - Directory.Build.props
      - global.json
      - scripts/release-notes.sh
      - vscode/package.json

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  # Exchanges the OIDC token for a temporary nuget.org key and stops. Nothing is built or pushed.
  nuget-login-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release   # must match the environment in the nuget.org policy
    permissions:
      id-token: write
    steps:
      - name: NuGet login (OIDC to a temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Report
        run: |
          if [ -n "${{ steps.login.outputs.NUGET_API_KEY }}" ]; then
            echo "nuget.org accepted the trusted publishing policy for this workflow."
          else
            echo "No API key returned." >&2
            exit 1
          fi

  version:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

  native:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }   # AOT cross-compiles across architectures, not across OSes
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish native binary
        run: dotnet publish src/Blackbox.Cli -c Release -r ${{ matrix.rid }} -p:Version=${{ env.VERSION }} -o out/${{ matrix.rid }}
      - name: Pack RID-specific tool package
        run: dotnet pack src/Blackbox.Cli -c Release -r ${{ matrix.rid }} -p:Version=${{ env.VERSION }} -o nupkg
      - name: Archive binary
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $name = "bbx-$env:VERSION-$rid"
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          $exe = if ($rid -like 'win-*') { 'bbx.exe' } else { 'bbx' }
          Copy-Item "out/$rid/$exe", LICENSE, README.md stage/
          if ($rid -like 'win-*') {
            Compress-Archive -Path stage/* -DestinationPath "dist/$name.zip"
          } else {
            tar -czf "dist/$name.tar.gz" -C stage .
          }
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            dist/*
            nupkg/*.nupkg
          if-no-files-found: error

  pointer:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack top-level (pointer) package
        run: dotnet pack src/Blackbox.Cli -c Release -p:Version=${{ env.VERSION }} -o nupkg
      - name: Pack framework-dependent fallback (any RID)
        run: dotnet pack src/Blackbox.Cli -c Release -r any -p:PublishAot=false -p:Version=${{ env.VERSION }} -o nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: pointer
          path: nupkg/*.nupkg
          if-no-files-found: error

  vsix:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: mkdir -p ../dist && npx --yes @vscode/vsce@4.1.0 package --no-dependencies -o ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

  verify:
    needs: [version, native, pointer, vsix]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Flatten artifacts and check every release file exists
        run: |
          set -euo pipefail
          find artifacts -mindepth 2 -type f -exec mv -t artifacts {} +
          ls -la artifacts
          for rid in win-x64 linux-x64 osx-arm64 osx-x64 any; do test -f "artifacts/AgentBlackbox.$rid.$VERSION.nupkg"; done
          test -f "artifacts/AgentBlackbox.$VERSION.nupkg"
          test -f "artifacts/bbx-$VERSION-win-x64.zip"
          for rid in linux-x64 osx-arm64 osx-x64; do test -f "artifacts/bbx-$VERSION-$rid.tar.gz"; done
          ls artifacts/agent-blackbox-*.vsix
      - name: Install the tool from the built packages and record one event
        run: |
          set -euo pipefail
          dotnet tool install AgentBlackbox --version "$VERSION" --tool-path "$RUNNER_TEMP/tool" --add-source "$PWD/artifacts"
          bbx="$RUNNER_TEMP/tool/bbx"
          "$bbx" --version
          project="$RUNNER_TEMP/project"; mkdir -p "$project"; cd "$project"
          "$bbx" init --local
          CLAUDE_PROJECT_DIR="$project" "$bbx" hook PostToolUse < "$GITHUB_WORKSPACE/fixtures/hook-events/PostToolUse.bash-test.json"
          "$bbx" verify
          "$bbx" report --format md | head -20

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, verify]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # nuget.org trusted publishing (OIDC)
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Flatten artifacts   # upload-artifact keeps the dist/ and nupkg/ folders
        run: find artifacts -mindepth 2 -type f -exec mv -t artifacts {} +
      - name: NuGet login (OIDC to a temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push RID packages first, top-level package last
        run: |
          set -euo pipefail
          push() { dotnet nuget push "$1" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate; }
          for rid in win-x64 linux-x64 osx-arm64 osx-x64 any; do push "artifacts/AgentBlackbox.$rid.$VERSION.nupkg"; done
          push "artifacts/AgentBlackbox.$VERSION.nupkg"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$VERSION" > notes.md
          pre=""; [[ "$VERSION" == *-* ]] && pre="--prerelease"
          gh release create "v$VERSION" artifacts/*.zip artifacts/*.tar.gz artifacts/*.vsix --title "v$VERSION" --notes-file notes.md $pre
      # Optional: each runs only when its token is set as a repository secret.
      - name: Publish to the VS Code Marketplace
        if: ${{ !contains(env.VERSION, '-') }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT not set; skipping the Marketplace."; exit 0; fi
          npx --yes @vscode/vsce@4.1.0 publish --packagePath artifacts/agent-blackbox-$VERSION.vsix
      - name: Publish to Open VSX
        if: ${{ !contains(env.VERSION, '-') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT not set; skipping Open VSX."; exit 0; fi
          npx --yes ovsx@1.3.0 publish artifacts/agent-blackbox-$VERSION.vsix
