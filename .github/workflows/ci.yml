name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  aot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Warnings are errors, so any AOT/trim warning fails this step.
      - run: dotnet publish src/Blackbox.Cli -c Release -o out
      - run: pwsh scripts/bench-hook.ps1 -Bbx out/bbx -Runs 50
      # Dogfood the GitHub Action (action.yml) with the binary built above, against this repo's own recordings.
      - name: bbx check (this repo's action)
        uses: ./
        with:
          bbx-path: ${{ runner.os == 'Windows' && 'out/bbx.exe' || 'out/bbx' }}
          require-tests: "true"
