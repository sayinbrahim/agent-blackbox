<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0a0e13; --panel: #10161e; --panel-2: #141c26; --line: #1f2a37; --text: #d7dfe8; --muted: #7f8c9a;
    --amber: #f2b33d; --green: #3fd68a; --red: #ff5f5f; --blue: #6cb6ff;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
  .placard { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
    border-bottom: 2px solid var(--amber); padding-bottom: 14px; margin-bottom: 24px; }
  .placard .kicker { font: 600 11px/1 var(--mono); letter-spacing: .22em; color: var(--amber); text-transform: uppercase; }
  .placard h1 { margin: 8px 0 0; font: 600 26px/1.2 var(--sans); letter-spacing: -.01em; }
  .placard .id { font: 12px var(--mono); color: var(--muted); text-align: right; }
  h2 { font: 600 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 36px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .tile { padding: 14px 16px; box-shadow: 0 0 0 .5px var(--line); }
  .tile .k { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .tile .v { font: 600 20px/1.3 var(--mono); margin-top: 4px; word-break: break-word; }
  .tile .v.small { font-size: 13px; font-weight: 500; }
  .status { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .badge { font: 600 12px var(--mono); padding: 8px 12px; border-radius: 4px; border: 1px solid; letter-spacing: .04em; }
  .ok { color: var(--green); border-color: rgba(63,214,138,.4); background: rgba(63,214,138,.07); }
  .warn { color: var(--amber); border-color: rgba(242,179,61,.45); background: rgba(242,179,61,.08); }
  .bad { color: var(--red); border-color: rgba(255,95,95,.45); background: rgba(255,95,95,.08); }
  .msg { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .timeline { position: relative; padding-left: 22px; }
  .timeline::before { content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
  details.prompt { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px; }
  details.prompt::before { content: ""; position: absolute; left: -21px; top: 16px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--amber); }
  details.prompt.has-error::before { border-color: var(--red); }
  summary { cursor: pointer; list-style: none; padding: 12px 16px; }
  summary::-webkit-details-marker { display: none; }
  .ph { font: 600 11px var(--mono); color: var(--amber); letter-spacing: .08em; }
  .ph span { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .pt { margin-top: 6px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  ol.actions { list-style: none; margin: 0; padding: 0 16px 12px; border-top: 1px solid var(--line); }
  ol.actions li { display: grid; grid-template-columns: 68px 16px 1fr; gap: 8px; padding: 5px 0; font: 12.5px/1.5 var(--mono);
    border-bottom: 1px dashed rgba(127,140,154,.12); }
  ol.actions li:last-child { border-bottom: 0; }
  .t { color: var(--muted); }
  .dot.ok { color: var(--green); border: 0; background: none; } .dot.bad { color: var(--red); border: 0; background: none; } .dot.sys { color: var(--muted); }
  li.fail .d { color: var(--red); }
  .d { word-break: break-word; }
  ul.anoms { list-style: none; margin: 0; padding: 0; }
  ul.anoms li { background: var(--panel); border-left: 3px solid var(--amber); padding: 10px 14px; margin-bottom: 8px; font: 13px var(--mono); border-radius: 0 4px 4px 0; }
  ul.anoms li.failed-tool-call { border-left-color: var(--red); }
  ul.anoms li .k { color: var(--muted); margin-right: 8px; }
  .empty { color: var(--muted); font-style: italic; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; background: var(--panel-2); text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
  td.num { text-align: right; } .plus { color: var(--green); } .minus { color: var(--red); }
  tr:last-child td { border-bottom: 0; }
  footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font: 11.5px/1.7 var(--mono); color: var(--muted); }
  footer code { color: var(--text); word-break: break-all; }
</style>
</head>
<body>
<main>
  <header class="placard">
    <div>
      <div class="kicker">agent-blackbox · flight data report</div>
      <h1>{{HEADLINE}}</h1>
    </div>
    <div class="id">session {{SESSION}}<br>{{WHEN}}</div>
  </header>

  <h2>Flight summary</h2>
  {{SUMMARY}}

  <h2>Timeline</h2>
  {{TIMELINE}}

  <h2>Anomalies</h2>
  {{ANOMALIES}}

  <h2>Files touched</h2>
  {{FILES}}

  <footer>
    {{FOOTER}}
  </footer>
</main>
</body>
</html>
